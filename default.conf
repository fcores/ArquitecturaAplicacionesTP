upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Static SPA
    root   /usr/share/nginx/html;
    index  index.html;

    # Rutas del front → index.html (SPA)
    location / {
        try_files $uri /index.html;
    }

    # Pasar /api/... SIN duplicar /api (nota el slash final en proxy_pass)
    location /api/ {
        proxy_pass http://backend.default.svc.cluster.local:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Alias: /events → /api/events (con y sin barra final)
    location = /events {
        proxy_pass http://backend.default.svc.cluster.local:8000/api/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location /events/ {
        proxy_pass http://backend.default.svc.cluster.local:8000/api/events/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health opcional
    location = /healthz {
        proxy_pass http://backend.default.svc.cluster.local:8000/healthz;
    }
}