# Upstream al Service "backend" (mismo namespace), puerto 8000
upstream backend_upstream {
    server backend:8000;        # DNS del Service de K8s
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Static SPA
    root   /usr/share/nginx/html;
    index  index.html;

    # Cache agresiva para assets estáticos (opcional)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas del front → index.html (SPA)
    location / {
        try_files $uri /index.html;
    }

    # Pasar /api/... tal cual (IMPORTANTE: SIN slash final)
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend_upstream;   # ← sin "/"
    }

    # Alias: /events → /api/events
    location = /events {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend_upstream/api/events;
    }
    location /events/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend_upstream/api/events/;
    }

    # Health opcional
    location = /healthz {
        proxy_pass http://backend_upstream/healthz;
    }

    # (opcional) subidas más grandes
    # client_max_body_size 10m;
}