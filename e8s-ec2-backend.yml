# ----------------------------- 
# Deployment Backend
# ----------------------------- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketpardo-backend
  labels:
    app: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: ezequielfina/ticketpardo-backend:kube
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          # Health checks corregidos
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Recursos ajustados para permitir HPA
          resources:
            requests:
              cpu: 50m      # Reducido para que sea más fácil alcanzar el threshold
              memory: 64Mi
            limits:
              cpu: 200m     # Límite más bajo para forzar scaling
              memory: 128Mi
          env:
            - name: ENV
              value: "production"

---
# ----------------------------- 
# Service para Backend
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-backend-service
  labels:
    app: fastapi
spec:
  type: ClusterIP
  selector:
    app: fastapi
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      name: http
  # Configuración para mejor balanceo
  sessionAffinity: None  # Asegura round-robin

---
# ----------------------------- 
# NodePort Service (para acceso directo)
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-backend-nodeport
  labels:
    app: fastapi
spec:
  type: NodePort
  selector:
    app: fastapi
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30800  # Acceso: http://TU-IP-EC2:30800
  sessionAffinity: None

---
# ----------------------------- 
# Ingress para Backend
# ----------------------------- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketpardo-backend-ingress
  labels:
    app: fastapi
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    # Configuración para mejor load balancing
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    nginx.ingress.kubernetes.io/load-balance: "round_robin"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ticketpardo-backend-service
                port:
                  number: 8000

---
# ----------------------------- 
# HPA más agresivo para Backend
# ----------------------------- 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketpardo-backend-hpa
  labels:
    app: fastapi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketpardo-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 20  # Más bajo para escalar más fácil
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

---
# ----------------------------- 
# PodDisruptionBudget
# ----------------------------- 
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticketpardo-backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fastapi