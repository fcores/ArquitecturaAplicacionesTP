# ----------------------------- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketpardo-frontend
  labels:
    app: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
        - name: react
          image: ezequielfina/ticketpardo-frontend:kube
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # Health checks para mejor manejo en la nube
          livenessProbe:
            httpGet:
              path: /health  
              port: 3000
            initialDelaySeconds: 60  # Aumentado para dar más tiempo
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30  # Aumentado
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          env:
            - name: ENV
              value: "production"
            - name: REACT_APP_API_URL
              value: "http://3.20.238.113:8000"

---
# ----------------------------- 
# Service ClusterIP (para uso interno)
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-frontend-service
  labels:
    app: react
spec:
  type: ClusterIP
  selector:
    app: react
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http

---
# ----------------------------- 
# Service NodePort (acceso externo para frontend)
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-frontend-nodeport
  labels:
    app: react
spec:
  type: NodePort
  selector:
    app: react  # Corregido: debe apuntar al frontend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080  # Acceso: http://TU-IP-EC2:30080

---
# ----------------------------- 
# Ingress para Frontend
# ----------------------------- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketpardo-frontend-ingress
  labels:
    app: react
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketpardo-frontend-service  # Corregido
                port:
                  number: 3000
