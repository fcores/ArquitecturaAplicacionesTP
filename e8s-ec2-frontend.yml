# ----------------------------- 
# Deployment Frontend
# ----------------------------- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketpardo-frontend
  labels:
    app: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
        - name: react
          image: ezequielfina/ticketpardo-frontend:kube
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # Health checks mejorados
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Recursos ajustados
          resources:
            requests:
              cpu: 50m      # Reducido para facilitar scaling
              memory: 64Mi
            limits:
              cpu: 150m     # Límite más bajo
              memory: 128Mi
          env:
            - name: ENV
              value: "production"
            - name: REACT_APP_API_URL
              value: "http://3.20.238.113:8000"  # URL del backend

---
# ----------------------------- 
# Service ClusterIP para Frontend
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-frontend-service
  labels:
    app: react
spec:
  type: ClusterIP
  selector:
    app: react
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http
  sessionAffinity: None  # Sin afinidad de sesión

---
# ----------------------------- 
# NodePort Service para Frontend
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-frontend-nodeport
  labels:
    app: react
spec:
  type: NodePort
  selector:
    app: react
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
  sessionAffinity: None

---
# ----------------------------- 
# Ingress para Frontend
# ----------------------------- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketpardo-frontend-ingress
  labels:
    app: react
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    # Load balancing mejorado
    nginx.ingress.kubernetes.io/load-balance: "round_robin"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketpardo-frontend-service
                port:
                  number: 3000

---
# ----------------------------- 
# HPA más agresivo para Frontend
# ----------------------------- 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketpardo-frontend-hpa
  labels:
    app: react
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketpardo-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 25  # Más bajo para facilitar scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 35
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

---
# ----------------------------- 
# PodDisruptionBudget
# ----------------------------- 
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticketpardo-frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: react