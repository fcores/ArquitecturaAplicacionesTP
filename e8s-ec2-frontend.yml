# ----------------------------- 
# Deployment para Frontend
# ----------------------------- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketpardo-frontend
  labels:
    app: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
        - name: react
          image: ezequielfina/ticketpardo-frontend:prod  # ✅ Nueva imagen
          imagePullPolicy: Always
          ports:
            - containerPort: 80  # ✅ Nginx usa puerto 80
          # Health checks para Nginx
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi   # ✅ Mucho menos memoria
            limits:
              cpu: 200m
              memory: 128Mi  # ✅ Límites bajos
          env:
            - name: ENV
              value: "production"

---
# ----------------------------- 
# Service ClusterIP para Frontend
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-frontend-service
  labels:
    app: react
spec:
  type: ClusterIP
  selector:
    app: react
  ports:
    - protocol: TCP
      port: 80        # ✅ Cambiar a 80
      targetPort: 80  # ✅ Cambiar a 80
      name: http
  sessionAffinity: None

---
# ----------------------------- 
# NodePort Service para Frontend
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-frontend-nodeport
  labels:
    app: react
spec:
  type: NodePort
  selector:
    app: react
  ports:
    - name: http
      protocol: TCP
      port: 80        # ✅ Cambiar a 80
      targetPort: 80  # ✅ Cambiar a 80
      nodePort: 30080
  sessionAffinity: None

---
# ----------------------------- 
# Ingress para Frontend
# ----------------------------- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketpardo-frontend-ingress
  labels:
    app: react
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/load-balance: "round_robin"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketpardo-frontend-service
                port:
                  number: 80  # ✅ Cambiar a 80

---
# ----------------------------- 
# HPA para Frontend
# ----------------------------- 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketpardo-frontend-hpa
  labels:
    app: react
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketpardo-frontend
  minReplicas: 2
  maxReplicas: 5  # ✅ Más pods porque usa menos memoria
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

---
# ----------------------------- 
# PodDisruptionBudget
# ----------------------------- 
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticketpardo-frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: react