# ----------------------------- 
# Deployment Frontend - Memoria Corregida
# ----------------------------- 
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketpardo-frontend
  labels:
    app: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
        - name: react
          image: ezequielfina/ticketpardo-frontend:kube
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # Health checks con más tiempo
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60  # Más tiempo para arrancar
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # ✅ RECURSOS AUMENTADOS DRAMÁTICAMENTE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi    # ✅ Cuadruplicado
            limits:
              cpu: 500m        # ✅ Más CPU también
              memory: 512Mi    # ✅ Cuadruplicado el límite
          env:
            - name: ENV
              value: "production"
            - name: REACT_APP_API_URL
              value: "http://3.20.238.113:8000"

---
# ----------------------------- 
# HPA Frontend Ajustado
# ----------------------------- 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketpardo-frontend-hpa
  labels:
    app: react
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketpardo-frontend
  minReplicas: 2
  maxReplicas: 4  # ✅ Reducido porque cada pod usa más memoria
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50  # ✅ Más alto porque tenemos más CPU
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60  # ✅ Más alto porque tenemos más memoria
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30  # ✅ Más lento para evitar OOM
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60