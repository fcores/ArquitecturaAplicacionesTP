apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketpardo-frontend
  labels:
    app: react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react
  template:
    metadata:
      labels:
        app: react
    spec:
      containers:
        - name: react
          image: ezequielfina/ticketpardo-frontend:kube
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # Health checks con tiempos largos para React
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          # Recursos suficientes para React
          resources:
            requests:
              cpu: 100m
              memory: 300Mi    # 300MB request
            limits:
              cpu: 500m
              memory: 600Mi    # 600MB limit
          env:
            - name: ENV
              value: "production"
            - name: REACT_APP_API_URL
              value: "http://3.20.238.113:8000"

---
# ----------------------------- 
# Service ClusterIP para Frontend
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-frontend-service
  labels:
    app: react
spec:
  type: ClusterIP
  selector:
    app: react
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: http
  sessionAffinity: None  # Sin afinidad de sesión

---
# ----------------------------- 
# NodePort Service para Frontend
# ----------------------------- 
apiVersion: v1
kind: Service
metadata:
  name: ticketpardo-frontend-nodeport
  labels:
    app: react
spec:
  type: NodePort
  selector:
    app: react
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
  sessionAffinity: None

---
# ----------------------------- 
# Ingress para Frontend
# ----------------------------- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketpardo-frontend-ingress
  labels:
    app: react
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    # Load balancing mejorado
    nginx.ingress.kubernetes.io/load-balance: "round_robin"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticketpardo-frontend-service
                port:
                  number: 3000

---
# ----------------------------- 
# HPA para Frontend
# ----------------------------- 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketpardo-frontend-hpa
  labels:
    app: react
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketpardo-frontend
  minReplicas: 2
  maxReplicas: 3  # Solo 3 pods máximo por memoria
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60  # Más lento para no saturar
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

---
# ----------------------------- 
# PodDisruptionBudget
# ----------------------------- 
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticketpardo-frontend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: react