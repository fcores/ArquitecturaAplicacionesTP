apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketpardo-backend
  namespace: ticketpardo
  labels:
    app: ticketpardo-backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketpardo-backend
  template:
    metadata:
      labels:
        app: ticketpardo-backend
        component: api
    spec:
      containers:
      - name: backend
        image: ticketpardo-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
