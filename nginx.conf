# /etc/nginx/nginx.conf
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Rendimiento / defaults seguros
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Logs
  access_log  /var/log/nginx/access.log  combined;

  # Si tu API acepta payloads grandes, ajustá esto
  client_max_body_size 10m;

  # Compresión
  gzip on;
  gzip_types
    text/plain text/css application/json application/javascript
    text/xml application/xml application/xml+rss text/javascript
    image/svg+xml;

  # Upstream del backend en Kubernetes
  upstream api_upstream {
    server backend.ticketpardo.svc.cluster.local:8000;
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Archivos del build del front
    root  /usr/share/nginx/html;
    index index.html;

    # --- SPA (React/Vite) ---
    location / {
      # Primer intento: archivo estático; si no existe, devolvé el index
      try_files $uri $uri/ /index.html;

      # Evitá contenido viejo después de un deploy
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires -1;
    }

    # --- Proxy a FastAPI dentro del cluster ---
    location /api/ {
      proxy_pass http://api_upstream/;    # importante el "/" final

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck simple
    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }
  }
}
